name: Build Android ARM64 Next

on:
  push:
    branches:
      - v1.1.17-next
  workflow_dispatch:

concurrency:
  group: android-arm64-next
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Inject fallback configuration
        env:
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
        shell: bash
        run: |
          mkdir -p lib/secrets
          printf "const String siliconflowFallbackKey = '%s';\n" "$SILICONFLOW_KEY" > lib/secrets/fallback.dart

      - name: Configure release signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare and verify ARM64 artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk='dist/Kelivo_android_v1.1.17-next_arm64-v8a.apk'
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"

          mapfile -t abis < <(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)
          if [ "${#abis[@]}" -ne 1 ] || [ "${abis[0]}" != 'arm64-v8a' ]; then
            printf 'Unexpected APK ABIs: %s\n' "${abis[*]:-none}" >&2
            exit 1
          fi

          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo 'apksigner was not found' >&2
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

          (
            cd dist
            sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256"
          )

          short_sha="${GITHUB_SHA::8}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kelivo-Android-arm64-v8a-${{ steps.artifact.outputs.short_sha }}
          path: |
            dist/Kelivo_android_v1.1.17-next_arm64-v8a.apk
            dist/Kelivo_android_v1.1.17-next_arm64-v8a.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: v1.1.17-next-latest
        shell: bash
        run: |
          set -euo pipefail
          git tag --force "$ROLLING_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$ROLLING_TAG" --force

          title='Kelivo v1.1.17-next (latest)'
          notes="Automated ARM64 release from branch \`v1.1.17-next\`.\n\nCommit: \`$GITHUB_SHA\`"
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release edit "$ROLLING_TAG" --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$ROLLING_TAG" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload "$ROLLING_TAG" dist/* --clobber
